<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard | SRMS</title>

<style>
body {
  margin: 0;
  font-family: Poppins, Arial, sans-serif;
  background: #f4f7fb;
}

.layout {
  display: flex;
  min-height: 100vh;
}

/* Sidebar */
.sidebar {
  width: 240px;
  background: #1e293b;
  color: white;
  padding: 25px;
}

.sidebar h2 {
  margin-bottom: 30px;
}

.sidebar a {
  display: block;
  color: #cbd5f5;
  text-decoration: none;
  margin: 14px 0;
}

/* Content */
.content {
  flex: 1;
  padding: 30px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  margin-bottom: 25px;
}

.card {
  background: #fff;
  padding: 20px;
  border-radius: 14px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.06);
}

.card h4 {
  margin: 0;
  color: #555;
}

.card p {
  font-size: 28px;
  margin: 8px 0 0;
  color: #2563eb;
}

.table-box {
  background: #fff;
  border-radius: 14px;
  padding: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.06);
}

table {
  width: 100%;
  border-collapse: collapse;
}

thead {
  background: #eef2ff;
}

th, td {
  padding: 14px;
  text-align: center;
  border-bottom: 1px solid #eee;
}

.pass { color: green; font-weight: 600; }
.fail { color: red; font-weight: 600; }

/* Search dropdown */
.search-box {
  position: relative;
  max-width: 300px;
  margin-bottom: 20px;
}

.search-box input {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

.dropdown {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background: #fff;
  border: 1px solid #ddd;
  max-height: 200px;
  overflow-y: auto;
  display: none;
  z-index: 1000;
}

.dropdown div {
  padding: 8px;
  cursor: pointer;
}

.dropdown div:hover {
  background: #eef2ff;
}
</style>
</head>

<body>

<div class="layout">
  <div class="sidebar">
    <h2>Admin Panel</h2>
    <a href="admin.html">Dashboard</a>
    <a href="adminstudent.html">Students</a>
    <a href="admin-results.html">Results</a>
  </div>

  <div class="content">
    <h1>Admin Dashboard</h1>

    <!-- Searchable dropdown -->
    <div class="search-box">
      <input
        type="text"
        id="studentSearch"
        placeholder="Search student (ID or name)"
        autocomplete="off"
      >
      <div id="studentDropdown" class="dropdown"></div>
    </div>

    <!-- Cards -->
    <div class="cards">
      <div class="card"><h4>Total Students</h4><p id="totalStudents">0</p></div>
      <div class="card"><h4>Total Subjects</h4><p id="totalResults">0</p></div>
      <div class="card"><h4>Passed</h4><p id="passed">0</p></div>
      <div class="card"><h4>Failed</h4><p id="failed">0</p></div>
      <div class="card"><h4>Pass Percentage</h4><p id="passPercent">0%</p></div>
    </div>

    <!-- Table -->
    <div class="table-box">
      <table>
        <thead>
          <tr>
            <th>Student ID</th>
            <th>Subject</th>
            <th>Marks</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="resultTable">
          <tr><td colspan="4">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
const API = "https://student-result-management-system-srms.onrender.com/api";

let allStudents = [];
let allResults = [];
let selectedStudentId = "ALL";

/*  INITIAL LOAD  */
async function initDashboard() {
  allStudents = await fetch(`${API}/students`).then(r => r.json());
  allResults = await fetch(`${API}/results`).then(r => r.json());

  setupSearchDropdown();
  renderDashboard("ALL");
}

/*  SEARCHABLE DROPDOWN  */
function setupSearchDropdown() {
  const input = document.getElementById("studentSearch");
  const dropdown = document.getElementById("studentDropdown");

  function showDropdown(list) {
    dropdown.innerHTML = "";
    if (list.length === 0) {
      dropdown.style.display = "none";
      return;
    }

    list.forEach(s => {
      const div = document.createElement("div");
      div.textContent = `${s.studentId} - ${s.name}`;

      div.onclick = () => {
        input.value = `${s.studentId} - ${s.name}`;
        dropdown.style.display = "none";
        selectedStudentId = s.studentId;
        renderDashboard(selectedStudentId);
      };

      dropdown.appendChild(div);
    });

    dropdown.style.display = "block";
  }

  input.addEventListener("focus", () => {
    showDropdown(allStudents);
  });

  input.addEventListener("input", () => {
    const value = input.value.toLowerCase();

    if (!value) {
      selectedStudentId = "ALL";
      renderDashboard("ALL");
      showDropdown(allStudents);
      return;
    }

    const filtered = allStudents.filter(s =>
      s.studentId.toLowerCase().includes(value) ||
      s.name.toLowerCase().includes(value)
    );

    showDropdown(filtered);
  });

  document.addEventListener("click", e => {
    if (!e.target.closest(".search-box")) {
      dropdown.style.display = "none";
    }
  });
}

/*  RENDER DASHBOARD  */
function renderDashboard(studentId) {
  const tbody = document.getElementById("resultTable");
  tbody.innerHTML = "";

  let totalSubjects = 0;
  let passCount = 0;
  let failCount = 0;

  const filteredResults =
    studentId === "ALL"
      ? allResults
      : allResults.filter(r => r.studentId === studentId);

  if (filteredResults.length === 0) {
    tbody.innerHTML = `<tr><td colspan="4">No results found</td></tr>`;
  }

  filteredResults.forEach(result => {
    result.subjects.forEach(sub => {
      totalSubjects++;
      const isPass = sub.marks >= 33;

      if (isPass) passCount++;
      else failCount++;

      tbody.innerHTML += `
        <tr>
          <td>${result.studentId}</td>
          <td>${sub.subjectName}</td>
          <td>${sub.marks}</td>
          <td class="${isPass ? "pass" : "fail"}">
            ${isPass ? "PASS" : "FAIL"}
          </td>
        </tr>
      `;
    });
  });

  document.getElementById("totalStudents").innerText =
    studentId === "ALL" ? allStudents.length : 1;

  document.getElementById("totalResults").innerText = totalSubjects;
  document.getElementById("passed").innerText = passCount;
  document.getElementById("failed").innerText = failCount;

  const percent = totalSubjects
    ? ((passCount / totalSubjects) * 100).toFixed(2)
    : "0.00";

  document.getElementById("passPercent").innerText = percent + "%";
}

document.addEventListener("DOMContentLoaded", initDashboard);
</script>

</body>
</html>
