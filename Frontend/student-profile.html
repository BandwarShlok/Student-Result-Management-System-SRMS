<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Profile</title>

<style>
:root {
  --primary: #2563eb;
  --bg: #f4f7fb;
  --card: #ffffff;
  --text: #1f2937;
  --muted: #6b7280;
}

* {
  box-sizing: border-box;
  font-family: "Poppins", system-ui, sans-serif;
}

body {
  margin: 0;
  background: var(--bg);
}

/* Layout */
.layout {
  display: flex;
  min-height: 100vh;
}

/* Sidebar */
.sidebar {
  width: 240px;
  background: #1e293b;
  color: white;
  padding: 25px;
}

.sidebar h3 {
  margin-bottom: 30px;
}

.sidebar a {
  display: block;
  color: #cbd5f5;
  text-decoration: none;
  margin: 14px 0;
}

.sidebar a.active {
  color: #ffffff;
  font-weight: 600;
}

/* Content */
.content {
  flex: 1;
  padding: 30px;
  animation: fadeUp 0.6s ease;
}

/* Animation */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Profile Card */
.profile-card {
  background: var(--card);
  border-radius: 20px;
  box-shadow: 0 12px 25px rgba(0,0,0,0.08);
  padding: 30px;
  margin-bottom: 30px;
}

.profile-header {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 25px;
}

.avatar {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: #e0e7ff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 34px;
  font-weight: 600;
  color: var(--primary);
}

.profile-header h2 {
  margin: 0;
}

.profile-header small {
  color: var(--muted);
}

/* Info Grid */
.info-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
  gap: 20px;
}

.info-item {
  background: #f8fafc;
  padding: 16px;
  border-radius: 14px;
}

.info-item small {
  color: var(--muted);
}

.info-item p {
  margin-top: 6px;
  font-weight: 500;
}

/* Button */
.btn {
  margin-top: 25px;
  padding: 12px 18px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  transition: 0.25s;
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 20px rgba(37,99,235,0.4);
}
</style>
</head>

<body>

<div class="layout">
  <div class="sidebar">
    <h3>Student Panel</h3>
    <a href="student.html">Dashboard</a>
    <a href="student-result.html">My Result</a>
    <a href="student-profile.html" class="active">Profile</a>
  </div>

  <div class="content">
    <div class="profile-card">
      <div class="profile-header">
        <div class="avatar">R</div>
        <div>
          <h2>Rahul Sharma</h2>
          <small>B.Tech • Semester 5</small>
        </div>
      </div>

      <div class="info-grid">
        <div class="info-item">
          <small>Student ID</small>
          <p>ST101</p>
        </div>
        <div class="info-item">
          <small>Email</small>
          <p>rahul.sharma@email.com</p>
        </div>
        <div class="info-item">
          <small>Phone</small>
          <p>+91 98765 43210</p>
        </div>
        <div class="info-item">
          <small>Course</small>
          <p>B.Tech</p>
        </div>
        <div class="info-item">
          <small>Department</small>
          <p>Computer Science</p>
        </div>
        <div class="info-item">
          <small>Enrollment Year</small>
          <p>2022</p>
        </div>
      </div>

      <button class="btn">Edit Profile</button>
    </div>
  </div>
</div>
<script>
const API = "http://localhost:5000/api";
const studentId = localStorage.getItem("studentId") || "SI101";

async function loadProfile() {
  const res = await fetch(`${API}/students`);
  const students = await res.json();

  const s = students.find(st => st.studentId === studentId);
  if (!s) return;

  document.querySelector(".avatar").innerText = s.name[0];
  document.querySelector(".profile-header h2").innerText = s.name;
  document.querySelector(".profile-header small").innerText =
    `${s.course} • Semester ${s.semester || "-"}`;

  const values = document.querySelectorAll(".info-item p");
  values[0].innerText = s.studentId;
  values[1].innerText = s.email || "-";
  values[2].innerText = s.phone || "-";
  values[3].innerText = s.course;
  values[4].innerText = s.department || "-";
  values[5].innerText = s.enrollmentYear || "-";
}

loadProfile();
</script>

</body>
</html>
